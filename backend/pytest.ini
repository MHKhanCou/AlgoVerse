[pytest]
testpaths = tests
# Put the backend directory itself on sys.path so `app` is importable when the
# suite is run as `pytest` and not only as `python -m pytest` (the latter adds
# the cwd by itself). CI and local runs should not depend on which one is used.
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
