name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` (not `npm install`) so the lockfile is authoritative and a
      # drifted lockfile fails the build instead of being silently rewritten.
      - name: Install dependencies
        run: npm ci

      # Lints the whole tree, not just src/ and e2e/, so tooling config files
      # are covered too - the two errors that lived in vite.config.js (an
      # unused parameter and an undefined `process`) were invisible here
      # because this step used to skip that file.
      # --max-warnings is deliberately generous: the repo carries 19 advisory
      # react-hooks/react-refresh warnings. Errors are gated at zero so no new
      # undefined reference or unused binding can land.
      - name: Lint
        run: npx eslint . --max-warnings 25

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

      # The deploy-config test also checks that no absolute path referenced by
      # the built index.html would be swallowed by the SPA rewrite. That check
      # is a no-op until dist/ exists, so re-run it after the build.
      - name: Re-check deploy config against the built output
        run: npx vitest run src/engine/__tests__/deploy-config.test.js

      # Real-browser checks against the production build. jsdom cannot see
      # canvas painting, real layout, or runtime errors in minified code; this
      # layer is what caught the /demo DP tab crashing the page.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run e2e suites
        run: npm run e2e

      - name: Upload e2e screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: frontend/e2e-output/
          if-no-files-found: ignore
          retention-days: 7
