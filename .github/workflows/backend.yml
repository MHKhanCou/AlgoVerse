name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches PYTHON_VERSION in backend/app/core/config.py and the Python
          # version Render builds with.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt

      # requirements-dev.txt pulls in the pinned runtime set via `-r`, so this
      # single install is the whole environment.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The suite runs against in-memory SQLite (tests/conftest.py overrides the
      # get_db dependency), so no database service or secrets are needed here.
      - name: Run tests
        run: python -m pytest tests/ -q
